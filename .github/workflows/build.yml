name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unzip and build
        run: |
          for z in *.zip; do unzip -q -o "$z" -d "x_${z%.zip}"; done
          S=$(find . -name 'settings.gradle*' -not -path './.git/*' | head -1)
          echo "Project: $S"
          cd "$(dirname "$S")"
          gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: '**/app-debug.apk'
